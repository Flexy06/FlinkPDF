name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: MinGW installieren
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix mingw-w64-tools python3-pil
      - name: Bauen und packen
        run: sh ./package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FlinkPDF
          path: dist/FlinkPDF.zip
      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FlinkPDF.zip
